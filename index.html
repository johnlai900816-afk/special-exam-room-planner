<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script>if(/[?&]v=/.test(location.search))location.replace('exam.html'+location.search+location.hash);</script>
<title>資源班管理系統</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>/* 外觀：主題（自動／淺色／深色）、字放大；先套用，避免閃一下 */
try{(function(r,t){t=localStorage.getItem('rc-theme');if(t==='light'||t==='dark')r.dataset.theme=t;if(localStorage.getItem('rc-big')==='1')r.classList.add('big');})(document.documentElement);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=20">
<link rel="stylesheet" href="iep.css?v=20">
</head>
<body>
<aside class="side">
  <div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i></span><div class="bt"><b>資源班管理系統</b><input id="title" type="text" placeholder="學校、學期" aria-label="學校、學年度、學期" onchange="D.title=this.value;save();paintSchool()"></div></div>
  <nav id="nav" aria-label="主選單"></nav>
  <div class="grow"></div>
  <div id="cloud"></div>
  <div id="prefs">
    <div class="seg" role="group" aria-label="外觀"><button type="button" data-th="auto">自動</button><button type="button" data-th="light">淺色</button><button type="button" data-th="dark">深色</button></div>
    <button type="button" class="b sm" id="fsBig" aria-pressed="false" title="字放大">A+</button>
  </div>
</aside>
<main id="main">
  <header class="ph">
    <div class="phrow"><h1 id="pgTitle"></h1><span class="grow"></span><div id="roleSw"></div></div>
    <nav class="sub" id="sub"></nav>
  </header>
  <div id="roBar">檢視權限：可以看和列印，不能修改。</div>
  <div id="page"></div>
  <iframe id="examFrame" title="段考" hidden></iframe>
</main>
<dialog id="dlg"><div id="dlgBody"></div></dialog>
<input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importJson(this)">
<div id="busy">排課中…</div>
<div id="toast"></div>
<script>/* 外觀設定的按鈕 */
(function(){var r=document.documentElement,P=document.getElementById('prefs'),fb=document.getElementById('fsBig');
  function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function put(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}}
  function paint(){var t=r.dataset.theme||'auto';P.querySelectorAll('[data-th]').forEach(function(b){var on=b.dataset.th===t;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});fb.setAttribute('aria-pressed',r.classList.contains('big'));}
  P.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
    if(b.dataset.th){var t=b.dataset.th;if(t==='auto'){delete r.dataset.theme;put('rc-theme',null);}else{r.dataset.theme=t;put('rc-theme',t);}}
    else if(b===fb){var on=r.classList.toggle('big');put('rc-big',on?'1':null);}
    paint();});
  paint();})();</script>
<script src="firebase-config.js"></script>
<script src="school.js?v=20"></script>
<script src="core.js?v=20"></script>
<script src="cloud.js?v=20"></script>
<script src="checkin.js?v=20"></script>
<script src="gemini.js?v=20"></script>
<script src="ai.js?v=20"></script>
<script src="iep.js?v=20"></script>
<script src="app.js?v=20"></script>
<!-- 附加功能（統計、導師週報、學年交接、家長聯絡紀錄…）。還沒有這個檔時會載入失敗，不影響其他功能 -->
<script src="extras.js?v=20"></script>
<!-- 老師模式的頁面（另一個分支做的）。還沒有這個檔時會載入失敗，不影響其他功能 -->
<script src="teacher.js?v=20"></script>
</body>
</html>
