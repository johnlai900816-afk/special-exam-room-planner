<script>
// 深色模式：跟著外層頁面（段考頁）或管理系統的 rc-theme；沒設定就跟系統
(function(){var r=document.documentElement;function th(){var t=null;try{if(parent!==window)t=parent.document.documentElement.getAttribute('data-theme');}catch(e){}
  if(t==null){try{t=localStorage.getItem('rc-theme');}catch(e){}}if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');}
  th();window.addEventListener('storage',function(e){if(e.key==='rc-theme')th();});
  try{if(parent!==window)new MutationObserver(th).observe(parent.document.documentElement,{attributes:true,attributeFilter:['data-theme']});}catch(e){}})();
</script>
<style>
/* ---------- 通知單本體（尺寸照原 Word 檔：A4、邊界 1.27cm、標楷體） ---------- */
.page{width:210mm;height:296.8mm;box-sizing:border-box;padding:12.7mm;position:relative;overflow:hidden;background:#fff;color:#000;
  font-family:"Times New Roman","標楷體","DFKai-SB","BiauKaiTC","BiauKai","Kaiti TC","AR PL UKai TW",serif;font-size:12pt;line-height:18pt;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;font-kerning:none;text-autospace:normal}
.page p{margin:0}
.page .t1,.page .t2{text-align:center;font-weight:bold;font-size:18pt;line-height:36pt}
.page .t1{margin-bottom:9pt}
.page .label{position:absolute;left:15.9mm;top:5.7mm;width:43.2mm;height:16.7mm;box-sizing:border-box;border:.5pt solid #000;background:#fff;

.page .who{font-weight:bold;font-size:18pt;line-height:36pt}
.page .who u{text-decoration-thickness:1pt;text-underline-offset:2pt}
.page .intro{font-size:16pt;line-height:36pt;text-indent:8.6mm;position:relative}
.page .intro .big{font-size:20pt}
.page .intro .dbl{font-weight:bold;text-decoration:underline double;text-decoration-thickness:.75pt;text-underline-offset:2.5pt}
.page .stamp{position:absolute;left:135.2mm;top:21.2mm;width:49.7mm;height:35.4mm;z-index:2;pointer-events:none}

/* ---------- 操作介面（DESIGN.md 的代號與元件；通知單本體永遠白底黑字） ---------- */
:root{--bg:#f7f5f1;--card:#ffffff;--sunk:#efece6;--line:#e7e3db;--line2:#d6d0c5;--ink:#1f2430;--ink2:#4a5060;--mute:#6b6f7a;--red:#b8423a;--blue:#2f5c8a;--blue-l:#e9eff6;
  --ok:#2f7a5b;--ok-l:#e6f2ec;--warn:#9a5b0b;--warn-l:#fbf0dc;--bad:#b3382d;--bad-l:#fbe8e5;--focus:#2f5c8a;--on-ink:#ffffff;
  --lift:0 1px 3px rgba(31,36,48,.1);--pop:0 12px 36px rgba(31,36,48,.16);--backdrop:rgba(31,36,48,.38);--sheet:0 1px 3px rgba(31,36,48,.12),0 8px 24px rgba(31,36,48,.06);
  --sans:"Noto Sans TC",system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;color-scheme:light}
@media screen and (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--card:#1e2128;--sunk:#191b21;--line:#2c3039;--line2:#3a3f4a;--ink:#eceef2;--ink2:#c3c7d0;--mute:#9096a3;--red:#e0776c;--blue:#7fa8d6;--blue-l:#1f2a38;
  --ok:#6cc39b;--ok-l:#18302a;--warn:#e3a957;--warn-l:#352a18;--bad:#ee8576;--bad-l:#3b2221;--focus:#7fa8d6;--on-ink:#15171c;
  --lift:0 1px 3px rgba(0,0,0,.4);--pop:0 12px 36px rgba(0,0,0,.5);--backdrop:rgba(0,0,0,.55);--sheet:0 1px 3px rgba(0,0,0,.5);color-scheme:dark}}
@media screen{:root[data-theme="dark"]{--bg:#15171c;--card:#1e2128;--sunk:#191b21;--line:#2c3039;--line2:#3a3f4a;--ink:#eceef2;--ink2:#c3c7d0;--mute:#9096a3;--red:#e0776c;--blue:#7fa8d6;--blue-l:#1f2a38;
  --ok:#6cc39b;--ok-l:#18302a;--warn:#e3a957;--warn-l:#352a18;--bad:#ee8576;--bad-l:#3b2221;--focus:#7fa8d6;--on-ink:#15171c;
  --lift:0 1px 3px rgba(0,0,0,.4);--pop:0 12px 36px rgba(0,0,0,.5);--backdrop:rgba(0,0,0,.55);--sheet:0 1px 3px rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);font-size:15px;line-height:1.55;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#app{display:grid;grid-template-columns:minmax(360px,460px) 1fr;height:100vh}
#side{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side header{padding:20px 20px 0;display:flex;align-items:center;gap:10px}
#side h1{font-size:22px;margin:0;letter-spacing:-.02em}
.mark{position:relative;width:22px;height:22px;flex:none}
.mark::before,.mark::after{content:"";position:absolute;width:15px;height:15px;border-radius:5px}
.mark::before{left:0;top:0;background:var(--red)}.mark::after{right:0;bottom:0;background:var(--blue);opacity:.9}
.tabs{display:inline-flex;gap:2px;padding:4px;margin:14px 20px 4px;background:var(--sunk);border-radius:999px;align-self:flex-start}
.tabs button{height:36px;border:0;background:none;border-radius:999px;padding:0 16px;font:inherit;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:var(--lift)}
#ed{overflow:auto;padding:12px 20px 40px;flex:1;min-height:0}
#ed h3{font-size:15px;margin:22px 0 10px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
#ed h3:first-child{margin-top:6px}
label.f{display:block;margin:0 0 10px;color:var(--mute);font-size:13px}
label.f>input,label.f>textarea{display:block;width:100%;margin-top:4px}
input[type=text],textarea,select{font:inherit;font-size:15px;height:40px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:var(--card);color:var(--ink);min-width:0}
textarea{height:auto;padding:10px 12px;resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus{outline:2px solid var(--focus);outline-offset:-1px}
input[type=checkbox]{accent-color:var(--ink);width:17px;height:17px;margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>label.f{flex:1;min-width:90px}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 18px;border:1px solid var(--line2);border-radius:999px;background:var(--card);color:var(--ink);font:inherit;font-size:15px;line-height:1;cursor:pointer;white-space:nowrap;text-decoration:none}
.b:hover{background:var(--sunk)}
.b.pri{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:700}
.b.pri:hover{background:var(--ink);opacity:.88}
.b.warn{color:var(--bad)}
.b.icon{width:40px;padding:0}
.b.dz{background:var(--bad);border-color:var(--bad);color:#fff}
table.g{border-collapse:collapse;width:100%;font-size:14px}
table.g th{font-weight:600;color:var(--mute);text-align:left;padding:4px 3px;font-size:12px}
table.g td{padding:3px;vertical-align:middle}
table.g td.n{width:24px;text-align:center;color:var(--mute);font-weight:700}
table.g input[type=text]{width:100%;height:34px;padding:0 8px;font-size:14px;border-radius:8px}
table.g input.t{width:62px;text-align:center;padding:0 4px}
table.g tr.sep td{border-top:1px dashed var(--line2);padding-top:6px}
.hint{color:var(--mute);font-size:13px;line-height:1.6;margin:4px 0 10px}
.hint a{color:var(--blue)}
code{background:var(--sunk);padding:0 5px;border-radius:4px;font-family:Consolas,monospace;font-size:13px}
#stuList{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
#stuList button{font:inherit;font-size:13px;height:32px;padding:0 12px;border:1px solid var(--line2);border-radius:999px;background:var(--card);color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
#stuList button.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.day{font-weight:700;margin:14px 0 4px;font-size:14px}
.chk{display:inline-flex;gap:6px;align-items:center;color:var(--ink2);font-size:14px;cursor:pointer;min-height:32px}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#bar{display:flex;gap:8px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#bar .sp{flex:1}
#bar .who{font-weight:700;font-variant-numeric:tabular-nums}
#lk{font-size:13px;color:var(--ok);display:inline-flex;gap:4px;align-items:center}
.hint.lk{background:var(--ok-l);border-radius:10px;padding:8px 12px;color:var(--ok)}
#pv{flex:1;overflow:auto;padding:24px;min-height:0}
#pv .page{margin:0 auto 20px;box-shadow:var(--sheet)}
.empty{color:var(--mute);margin:60px auto 0;display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap}
.emb #side header{display:none}
.emb .tabs{margin-top:16px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 20px;border-radius:999px;display:none;z-index:9;box-shadow:var(--pop);max-width:calc(100vw - 32px)}
dialog{border:0;border-radius:16px;padding:24px;width:min(520px,92vw);background:var(--card);color:var(--ink);box-shadow:var(--pop)}
dialog::backdrop{background:var(--backdrop)}
dialog h3{margin:0 0 8px;font-size:18px;padding-right:36px}
#print{display:none}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
dialog .x{position:absolute;right:12px;top:12px;border:0;background:none;color:var(--mute);cursor:pointer;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
dialog .x:hover{background:var(--sunk)}
dialog .dlgbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
dialog p.lead{white-space:pre-line;line-height:1.7;margin:4px 0 0;color:var(--ink2)}
#ovf{display:none;width:100%;background:var(--warn-l);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:14px}
/* 「？」說明（收合，預設收起） */
details.q{position:relative;display:inline-block;vertical-align:middle}
details.q>summary{list-style:none;cursor:pointer;width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--mute);background:var(--card)}
details.q>summary::-webkit-details-marker{display:none}
details.q[open]>summary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
@media (pointer:coarse){details.q>summary{width:40px;height:40px}}
.pop{position:absolute;z-index:20;top:calc(100% + 6px);left:0;width:max-content;max-width:min(340px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:var(--pop);font-size:14px;font-weight:400;line-height:1.75;color:var(--ink2);white-space:normal}
details.q.r .pop{left:auto;right:0}
.pop p{margin:0 0 6px}.pop p:last-child{margin:0}
@media (max-width:900px){#app{grid-template-columns:1fr;height:auto}#side{border-right:0;border-bottom:1px solid var(--line)}#ed{overflow:visible}#pv{overflow:visible;padding:12px}}
@page{size:A4;margin:0}
@media print{
  html,body{height:auto;background:#fff}
  #app,#toast,dialog{display:none!important}
  #print{display:block}
  #print .page{break-after:page;page-break-after:always}
  #print .page:last-child{break-after:auto;page-break-after:auto}
}
</style>

<script>
'use strict';
const KEY='exam-notice-v1', PLANNER_KEY='special-exam-room-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>'<svg class="ic" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const q=h=>'<details class="q"><summary aria-label="說明">?</summary><div class="pop">'+h+'</div></details>';
// 「？」點外面就收起
document.addEventListener('click',e=>{document.querySelectorAll('details.q[open]').forEach(d=>{if(!d.contains(e.target))d.open=false;});});
let D, cur=0, tab='stu';
// 確認／提醒視窗（取代瀏覽器內建的 confirm／alert）：按主要按鈕＝true
function askBox(msg,o){o=o||{};return new Promise(res=>{const d=$('ask');let done=false;
  const end=v=>{if(done)return;done=true;d.onclick=null;d.onclose=null;if(d.open)d.close();res(v);};
  d.innerHTML='<button class="x" data-r="x" aria-label="關閉">'+ic('x')+'</button><h3>'+esc(o.title||'請確認')+'</h3><p class="lead">'+esc(msg)+'</p><div class="dlgbtn">'+
    (o.alert?'':'<button class="b" data-r="0">取消</button>')+'<button class="b pri'+(o.danger?' dz':'')+'" data-r="1">'+esc(o.ok||'確定')+'</button></div>';
  d.onclick=e=>{const b=e.target.closest('[data-r]');if(b)end(b.dataset.r==='1');};d.onclose=()=>end(false);d.showModal();});}
const tellBox=(m,t)=>askBox(m,{alert:true,title:t||'提醒',ok:'知道了'});
// 日期統一寫法（和排列機相同）：「12/01」＝「12/1」，排序照學年
function normDate(s){const t=String(s==null?'':s).trim(),m=t.match(/^(?:(\d{2,4})\s*[\/.\-年]\s*)?(\d{1,2})\s*[\/.\-月]\s*(\d{1,2})\s*日?$/);
  if(!m)return t;return (m[1]?(+m[1])+'/':'')+(+m[2])+'/'+(+m[3]);}
function dateKey(s){const m=normDate(s).match(/^(?:(\d+)\/)?(\d+)\/(\d+)$/);if(!m)return 9e8;
  let y=m[1]?+m[1]:0;if(y&&y<1000)y+=1911;const mo=+m[2],d=+m[3];return y?y*10000+mo*100+d:(mo>=8?0:1)*10000+mo*100+d;}
// 共用名冊（管理系統）裡每位學生的個管老師
const RKEY='resource-class-v1';let RC=null;
function rosterCM(){if(RC)return RC;RC={byId:{},byCN:{}};try{const R=JSON.parse(localStorage.getItem(RKEY));if(R&&Array.isArray(R.students)){
  const tn={};(R.teachers||[]).forEach(t=>{tn[t.id]=t.name||'';});
  R.students.forEach(s=>{const n=tn[s.caseMgr];if(!n)return;RC.byId[s.id]=n;RC.byCN[String(s.cls)+'|'+String(s.name||'').replace(/\s+/g,'')]=n;});}}catch(e){}return RC;}
function caseMgrOf(stu){const R=rosterCM(),n=(stu.pid&&R.byId[stu.pid])||R.byCN[String(stu.cls)+'|'+String(stu.name||'').replace(/\s+/g,'')]||'';
  return n?(/老師$/.test(n)?n:n+'老師'):'';}

function defaultData(){
  const P=(n,a,b)=>({n:String(n),d:[{s:a[0],e:a[1],subj:a[2]},{s:b[0],e:b[1],subj:b[2]}]});
  return {
    v:1,link:true,
    head:{line1:'115學年度第1學期第1次段考',line2:'特殊考場通知單',label:'給副班長',teachers:'○○○老師、○○○老師',stampOn:true,stamp:''},
    days:[{date:'10月14日',dow:'三',pmMerge:false,pmText:''},{date:'10月15日',dow:'四',pmMerge:true,pmText:'服務學習(回原班)'}],
    amCount:4,
    periods:[
      P(1,['08:20','09:05','作文'],['08:20','09:05','自習']),
      P(2,['09:15','10:00','數學'],['09:15','10:00','國文']),
      P(3,['10:10','10:55','自習'],['10:10','10:55','自習']),
      P(4,['11:05','11:50','英文'],['11:05','11:55','生物(七)/理化(八九)']),
      P(5,['13:10','13:55','地科(九)/自習(七八)'],['','','']),
      P(6,['14:05','14:50','自習'],['','','']),
      P(7,['15:10','15:55','社會'],['','',''])
    ],

function normalize(o){
  const d=defaultData();
  o.head=Object.assign(d.head,o.head||{});
  o.days=(o.days&&o.days.length===2)?o.days:d.days;
  o.periods=o.periods||d.periods;o.amCount=o.amCount||4;
  o.periods.forEach(p=>{p.d=p.d||[{},{}];p.d.forEach(x=>{x.s=x.s||'';x.e=x.e||'';x.subj=x.subj||'';});});
  if(o.defLoc==null)o.defLoc=d.defLoc;if(o.notes==null)o.notes=d.notes;
  o.rooms=o.rooms||d.rooms;o.students=o.students||[];
  if(o.link===undefined)o.link=true;
  o.students.forEach(s=>{s.c=s.c||{};s.a=s.a||{};s.pm=s.pm||{};if(s.notes===undefined)s.notes=null;});
  return o;
}

function mark(s){
  return esc(s).replace(/__(.+?)__/g,'<u>$1</u>').replace(/\[\[(.+?)\]\]/g,'<span class="bx">$1</span>').replace(/==(.+?)==/g,'<span class="sh">$1</span>');
}
function lines2(text,shade){ // 單行 14pt；多行：第一行 12pt、其餘 9pt
  const a=String(text||'').split('/').map(x=>x.trim()).filter(x=>x!=='');
  if(a.length<=1)return shade&&a[0]?'<span class="sh">'+esc(a[0])+'</span>':esc(a[0]||'');
  return a.map((x,i)=>'<span class="'+(i?'s':'m')+'">'+esc(x)+'</span>').join('<br>');
}
function locHtml(text,shade){ // 單行 14pt；多行全部 12pt，灰底只加在第一行
  const a=String(text||'').split('/').map(x=>x.trim()).filter(x=>x!=='');
  if(!a.length)return '';
  const f=shade?'<span class="sh">'+esc(a[0])+'</span>':esc(a[0]);
  if(a.length===1)return f;
  return '<span class="m">'+f+a.slice(1).map(x=>'<br>'+esc(x)).join('')+'</span>';
}
function timeHtml(std,c){
  const s=(c&&c.s)||std.s,e=(c&&c.e)||std.e;
  if(!s&&!e)return '';
  const cs=s!==std.s,ce=e!==std.e;
  const a=cs?'<span class="bx'+(hm(s)<hm(std.s)?' sh':'')+'">'+esc(s)+'</span>':'<span>'+esc(s)+'</span>';
  const b=ce?'<span class="bx">'+esc(e)+'</span>':'<span>'+esc(e)+'</span>';
  return '<div class="tm">'+a+'<br>'+b+'</div>';
}
const cellOf=(stu,k)=>Object.assign({},stu.a[k],stu.c[k]);
function dayCells(stu,d,i){

  let v=el.type==='checkbox'?el.checked:el.value;
  if(el.classList.contains('t'))v=v.replace('：',':').trim();
  if(el.dataset.keep||el.classList.contains('K')||el.dataset.notes)setKeep(k,v);else setPath(k,typeof v==='string'?v.trim():v,el.type==='checkbox');
  save();renderPreview();
  if(el.classList.contains('K'))$('stuList').innerHTML=stuListHtml();
});
$('ed').addEventListener('change',e=>{const el=e.target;
  if(el.dataset.k==='link'&&D.link)autoSync('已同步');
  if(el.dataset.re||el.dataset.notes)renderEd();
  if(el.id==='stampFile'&&el.files[0]){const f=el.files[0];if(f.size>600*1024){toast('圖檔太大，請用 600KB 以下的圖');return;}
    const r=new FileReader();r.onload=()=>{D.head.stamp=r.result;D.head.stampOn=true;save();renderEd();renderPreview();};r.readAsDataURL(f);}
  if(el.id==='plFile'&&el.files[0])readJson(el.files[0],o=>syncPlanner(o,false,'已從設定檔帶入'));
  if(el.id==='impFile'&&el.files[0])readJson(el.files[0],o=>{if(!o.periods||!o.students||!o.head){tellBox('這不是通知單的設定檔。排列機的設定檔請用「用排列機設定檔」。');return;}D=normalize(o);cur=0;save();renderAll();toast('已匯入');});
});
function readJson(f,cb){const r=new FileReader();r.onload=()=>{let o;try{o=JSON.parse(r.result);}catch(e){tellBox('檔案讀不懂，請確認是 .json 設定檔');return;}cb(o);};r.readAsText(f);}
$('ed').addEventListener('click',async e=>{
  const sel=e.target.closest('[data-sel]');
  if(sel){cur=+sel.dataset.sel;renderAll();return;}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;if(a.tagName==='A')e.preventDefault();
  const s=D.students[cur];
  if(act==='add'){addOne();return;}
  else if(act==='dup'){const c=JSON.parse(JSON.stringify(s));c.name+='（複製）';delete c.pid;delete c.plName;c.c=Object.assign({},c.a,c.c);c.a={};D.students.splice(cur+1,0,c);cur++;}
  else if(act==='del'){if(!await askBox('確定刪除 '+stuId(s)+'？'))return;D.students.splice(cur,1);}
  else if(act==='sort'){const me=s;D.students.sort((x,y)=>String(x.cls).localeCompare(String(y.cls),'zh-Hant',{numeric:true})||String(x.seat).localeCompare(String(y.seat),'zh-Hant',{numeric:true}));cur=Math.max(0,D.students.indexOf(me));}
  else if(act==='resetNotes'){s.notes=null;}
  else if(act==='paste'){pasteDialog();return;}
  else if(act==='stamp'){$('stampFile').click();return;}
  else if(act==='stampReset'){D.head.stamp='';}
  else if(act==='plLocal'){const o=plannerData();
    if(!o){tellBox('找不到排考場的資料。請先排考場，或用排列機設定檔。');return;}
    D.link=true;syncPlanner(o,false,'已同步');return;}
  else if(act==='clearManual'){if(!await askBox('清掉手動改過的地點、時間、科目？姓名與注意事項會保留。'))return;D.students.forEach(x=>{if(x.pid){x.c={};x.pm={};}});}
  else if(act==='plFile'){$('plFile').click();return;}
  else if(act==='imp'){$('impFile').click();return;}
  else if(act==='exp'){const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'}),x=document.createElement('a');x.href=URL.createObjectURL(b);x.download='通知單設定_'+D.head.line1+'.json';document.body.appendChild(x);x.click();setTimeout(()=>{URL.revokeObjectURL(x.href);x.remove();},500);return;}
  else if(act==='clearStu'){if(!await askBox('確定清空全部 '+D.students.length+' 位學生？考試設定會保留。'))return;D.students=[];cur=0;}
  else if(act==='reset'){if(!await askBox(EMB?'確定通知單全部重來？補過的全名、注意事項與手動修改都會被清掉。':'確定全部還原成範例？目前的名單與設定都會被清掉。'))return;D=normalize(defaultData());cur=0;if(EMB){save();if(!autoSync('已重新產生'))renderAll();return;}}
  save();renderAll();
});
function pasteDialog(){
  const d=$('dlg');
  d.innerHTML='<button class="x" id="pasteX" aria-label="關閉">'+ic('x')+'</button><h3>貼上名單</h3><div class="hint">一行一位，例：<code>903-15 楊明杰</code>。可以從 Excel 複製三欄貼上；已有的班級座號只會補上姓名。</div><textarea id="pasteTa" rows="10" style="width:100%"></textarea><div class="dlgbtn"><button class="b" id="pasteNo">取消</button><button class="b pri" id="pasteOk">加入</button></div>';
  d.showModal();
  $('pasteNo').onclick=$('pasteX').onclick=()=>d.close();
  $('pasteOk').onclick=()=>{let n=0,u=0;
    $('pasteTa').value.split('\n').forEach(l=>{l=l.trim();if(!l)return;
      const m=l.match(/^(\d{3,4})\s*[-－\s,\t]\s*(\d{1,2})\s*[,\t\s]*\s*(.+)$/)||l.match(/^(\d{3,4})()\s*(.+)$/);
      const old=m&&m[2]&&D.students.find(x=>String(x.cls)===m[1]&&x.seat&&+x.seat===+m[2]);
      if(old){old.name=m[3].trim();u++;return;} // 班級座號已存在：只補上姓名
      D.students.push(m?{cls:m[1],seat:m[2]?m[2].padStart(2,'0'):'',name:m[3].trim(),a:{},c:{},pm:{},notes:null}:{cls:'',seat:'',name:l,a:{},c:{},pm:{},notes:null});n++;});
    d.close();if(n||u){if(n)cur=D.students.length-n;save();renderAll();toast((n?'已加入 '+n+' 位　':'')+(u?'已補上 '+u+' 位的姓名':''));}};
}

/* ---------- 與排列機連動 ---------- */
const PLANNER_URL='./';
const EMB=window.top!==window; // 放在排列機的「⑤ 學生通知單」分頁裡
if(EMB)document.documentElement.classList.add('emb');
// 名冊改了（例如換了個管老師）就重新讀
window.addEventListener('storage',e=>{if(e.key===RKEY){RC=null;renderPreview();}});
const GN={7:'七',8:'八',9:'九'};
let linkMsg='';
function plannerData(){try{const o=JSON.parse(localStorage.getItem(PLANNER_KEY));if(o&&o.students&&o.sessions&&o.rooms)return o;}catch(e){}return null;}
function autoSync(msg){if(!D.link)return false;const o=plannerData();if(!o)return false;return syncPlanner(o,true,msg);}
function syncPlanner(P,quiet,msg){
  if(!P||!P.students||!P.sessions||!P.rooms){if(!quiet)tellBox('這不是排列機的設定檔。');return false;}
  const me=D.students[cur];
  const tm=String(P.title||'').match(/(\d+)\s*學年度\s*第\s*(\d)\s*學期.*?第\s*(\d)\s*次段考/);
  if(tm)D.head.line1=tm[1]+'學年度第'+tm[2]+'學期第'+tm[3]+'次段考';
  // 日期統一寫法後再排序：「12/01」和「12/1」算同一天，先考的放第一天
  const ndate=s=>normDate(s.date);
  const dates=[...new Set(P.sessions.map(ndate))].sort((a,b)=>dateKey(a)-dateKey(b));
  if(dates.length>2&&!quiet)tellBox('排列機裡有 '+dates.length+' 個考試日，通知單只放得下兩天，會帶入前兩天。');
  const pidx=s=>{const m=String(s.period).match(/\d+/);return m?D.periods.findIndex(p=>String(p.n)===m[0]):-1;};
  dates.slice(0,2).forEach((dt,d)=>{const s=P.sessions.find(x=>ndate(x)===dt),m=String(dt).match(/(\d+)\D+(\d+)$/);
    D.days[d].date=m?(+m[1])+'月'+(+m[2])+'日':dt;if(s.dow)D.days[d].dow=s.dow;});
  // 考科與時間：排列機有的節次以排列機為準；上次帶入、這次已不存在的改回自習
  const allG=[...new Set([].concat(...P.sessions.map(s=>s.grades||[])))].sort();
  if(!D.periods.some(p=>p.d.some(x=>x.pl)))D.periods.forEach(p=>p.d.forEach(x=>{if(x.s)x.subj='自習';})); // 第一次連動：先清掉範例考科
  D.periods.forEach(p=>p.d.forEach(x=>{if(x.pl)x.pl=2;}));
  P.sessions.forEach(s=>{const d=dates.indexOf(ndate(s)),i=pidx(s);if(d<0||d>1||i<0||s.makeup)return;
    if(i>=D.amCount)D.days[d].pmMerge=false;
    const x=D.periods[i].d[d],g=s.grades||[],rest=allG.filter(y=>!g.includes(y));
    x.s=fmt(hm(s.start));x.e=fmt(hm(s.end));x.pl=1;
    const ns=(g.length&&rest.length)?s.subject+'('+g.map(y=>GN[y]||y).join('')+')/自習('+rest.map(y=>GN[y]||y).join('')+')':s.subject;
    if(x.plSubj===undefined||x.subj===x.plSubj)x.subj=ns; // 在「考試設定」改過科目寫法的，保留你的寫法
    x.plSubj=ns;});
  D.periods.forEach(p=>p.d.forEach(x=>{if(x.pl===2){delete x.pl;delete x.plSubj;x.subj='自習';}}));
  // 沒排考試、但那天下午沒合併的節次補上時間與「自習」
  D.periods.forEach((p,i)=>p.d.forEach((x,d)=>{if(i>=D.amCount&&!D.days[d].pmMerge&&!x.s){const o=p.d[1-d];x.s=o.s;x.e=o.e;if(!x.subj)x.subj='自習';}}));
  // 學生
  const sesById={},roomById={};P.sessions.forEach(s=>sesById[s.id]=s);P.rooms.forEach(r=>{roomById[r.id]=r;if(r.name&&!D.rooms.includes(r.name))D.rooms.push(r.name);});
  D.students=D.students.filter(s=>!s.demo);
  const seen=new Set();let add=0,gone=0;
  const sameName=(a,b)=>a&&b&&(a===b||a.endsWith(b)||b.endsWith(a));
  const waitR=P.rooms.find(r=>r.type==='wait'),gOf=c=>parseInt(String(c||'').trim()[0],10)||0;
  P.students.forEach(ps=>{if(ps.on===false)return;const cells={},waits=[];
    for(const k in (P.assign||{})){const sep=k.lastIndexOf('|');if(k.slice(0,sep)!==ps.id)continue;
      // 排列機的鍵是「學生|科目」；同一科分兩節考時是「學生|科目@節次代號」，科目要把 @ 後面拿掉
      const subj=k.slice(sep+1).replace(/@.*$/,''),a=P.assign[k],s=sesById[a.ses],r=roomById[a.room];if(!s||!r)continue;
      if(s.makeup)waits.push({subj,s});
      const d=dates.indexOf(ndate(s)),i=pidx(s);if(d<0||d>1||i<0)continue;
      const has=v=>{const sc=ps.sv&&ps.sv[v];return sc==='*'||(Array.isArray(sc)&&sc.includes(subj));};
      const c={loc:r.name},e=+s.extMin||0;
      if(has('ext')||has('pc'))c.shade=true;
      if(has('ext')&&e){if(s.extMode==='before')c.s=fmt(hm(s.start)-e);else c.e=fmt(hm(s.end)+e);}
      if(s.makeup)c.subj=subj+'(補考)';
      cells[d+'-'+i]=c;}
    // 改到補考節的學生：正考那一節要待在自習等候教室（以前會印成「原班」，學生會走錯地方）
    waits.forEach(w=>{const g=gOf(ps.cls);
      P.sessions.filter(x=>x.subject===w.subj&&!x.makeup&&(!g||(x.grades||[]).includes(g))).forEach(x=>{const d=dates.indexOf(ndate(x)),i=pidx(x);
        if(d<0||d>1||i<0||cells[d+'-'+i])return;
        cells[d+'-'+i]={loc:waitR?waitR.name:'自習等候教室',subj:'自習/('+w.subj+'改補考)',shade:true};});});
    if(!Object.keys(cells).length)return;
    let st=D.students.find(x=>x.pid===ps.id&&!seen.has(x))||
           D.students.find(x=>!x.pid&&!seen.has(x)&&String(x.cls)===String(ps.cls)&&(!x.seat||!ps.seat||+x.seat===+ps.seat)&&sameName(x.name,ps.name));
    if(st){if(st.pid&&st.name===st.plName)st.name=ps.name||'';
      st.cls=ps.cls||st.cls;st.seat=ps.seat||st.seat;}
    else{st={cls:ps.cls||'',seat:ps.seat||'',name:ps.name||'',a:{},c:{},pm:{},notes:null};D.students.push(st);add++;}
    st.pid=ps.id;st.plName=ps.name||'';st.a=cells;seen.add(st);
  });
  // 排列機已經沒有的學生：沒手動改過就移除，有改過就留下來變成手動學生
  D.students=D.students.filter(s=>{if(!s.pid||seen.has(s))return true;
    if(Object.keys(s.c).length||s.notes!=null){delete s.pid;delete s.plName;s.a={};return true;}gone++;return false;});
  D.students.sort((x,y)=>String(x.cls).localeCompare(String(y.cls),'zh-Hant',{numeric:true})||String(x.seat).localeCompare(String(y.seat),'zh-Hant',{numeric:true}));
  cur=Math.max(0,D.students.indexOf(me));
  const t=new Date();linkMsg='已同步 '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
  save();renderAll();
  if(msg)toast(msg+'：'+seen.size+' 位學生'+(add?'（新增 '+add+'）':'')+(gone?'（移除 '+gone+'）':''));
  return true;
}
// 其他老師改了通知單（由外層頁面從雲端寫進來）→ 重新讀取
function reloadData(){const me=D.students[cur],id=me&&(me.pid||stuId(me));D=load();const i=D.students.findIndex(s=>(s.pid||stuId(s))===id);cur=i<0?0:i;renderAll();}
window.addEventListener('storage',e=>{if(e.key===KEY)reloadData();});
if(EMB)document.addEventListener('DOMContentLoaded',()=>{const b=document.getElementById('tabData');if(b)b.textContent='其他';});
// 排列機一存檔，這裡立刻跟著更新
window.addEventListener('storage',e=>{if(e.key===PLANNER_KEY)autoSync('已更新');});

/* ---------- 列印 ---------- */
function doPrint(list){if(!list.length){toast('沒有學生可以印');return;}
  $('print').innerHTML=list.map(noticeHtml).join('');
  const imgs=[...$('print').querySelectorAll('img')];
  Promise.all(imgs.map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r;}))).then(()=>window.print());}
$('printAll').onclick=()=>doPrint(D.students);
$('printOne').onclick=()=>doPrint(D.students[cur]?[D.students[cur]]:[]);
$('prev').onclick=()=>{cur=(cur-1+D.students.length)%Math.max(1,D.students.length);renderAll();};
$('next').onclick=()=>{cur=(cur+1)%Math.max(1,D.students.length);renderAll();};
$('showAll').onchange=renderPreview;

function addOne(){D.students.push({cls:'',seat:'',name:'',a:{},c:{},pm:{},notes:null});cur=D.students.length-1;save();renderAll();}
function renderAll(){cur=Math.max(0,Math.min(cur,D.students.length-1));renderEd();renderPreview();$('lk').innerHTML=D.link&&linkMsg?ic('link')+' '+esc(linkMsg):'';}
D=load();
if(!autoSync())renderAll();
</script>
